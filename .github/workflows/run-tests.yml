---
name: run-tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Filament 3 — Laravel 11 only
          - php: "8.2"
            filament: "^3.2"
            laravel: "11.*"
            testbench: "^9.0"
            stability: "prefer-stable"
          - php: "8.4"
            filament: "^3.2"
            laravel: "11.*"
            testbench: "^9.0"
            stability: "prefer-stable"
          # Filament 4 — Laravel 11 / 12
          - php: "8.2"
            filament: "^4.0"
            laravel: "11.*"
            testbench: "^9.0"
            stability: "prefer-stable"
          - php: "8.4"
            filament: "^4.0"
            laravel: "12.*"
            testbench: "^10.0"
            stability: "prefer-stable"
          # Filament 5 — Laravel 12 / 13
          - php: "8.3"
            filament: "^5.0"
            laravel: "12.*"
            testbench: "^10.0"
            stability: "prefer-stable"
          - php: "8.5"
            filament: "^5.0"
            laravel: "13.*"
            testbench: "^11.0"
            stability: "prefer-stable"

    # No prefer-lowest legs: minimum-pinned cross-dependency combos in this
    # ecosystem resolve to mutually incompatible releases (e.g. testbench-core
    # 9.0.0 expects framework patches missing from 11.0.0), so they do not
    # reflect any real install.

    name: >-
      PHP ${{ matrix.php }} /
      ${{ matrix.filament }} /
      L${{ matrix.laravel }} /
      ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl,
            pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "filament/filament:${{ matrix.filament }}" \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist \
            --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
